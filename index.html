<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaberHealth - Global Emergency Card</title>
    <!-- Libreria QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Libreria per catturare la card come immagine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #070d12;
            --card-bg: #0f1923;
            --border-glow: #00ffcc44;
            --primary-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent-red: #ff4d4d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 22px;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-badge {
            background: var(--primary-cyan);
            color: #0b131a;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .title h1 {
            font-size: 17px;
            margin: 0;
            color: var(--text-main);
            font-weight: 700;
        }
        .title p {
            font-size: 11px;
            margin: 2px 0 0;
            color: var(--primary-cyan);
            letter-spacing: 0.5px;
        }
        .lang-select {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--primary-cyan);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-cyan);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 11px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.25);
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 18px 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: var(--primary-cyan);
        }
        .btn {
            width: 100%;
            background: var(--primary-cyan);
            color: #070d12;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.35);
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 15px;
        }

        /* STILE CARD GENERATA (PRO & HI-TECH) */
        #result-card {
            display: none;
            margin-top: 20px;
            background: linear-gradient(135deg, #0f1923 0%, #162636 100%);
            border: 2px solid var(--primary-cyan);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .card-top-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }
        .card-top-brand {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-cyan);
            letter-spacing: 0.5px;
        }
        .card-body-content p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.35;
        }
        .card-meta-box {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }
        #qrcode-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-badge">FH</div>
            <div class="title">
                <h1>FaberHealth</h1>
                <p>Global Emergency Card</p>
            </div>
        </div>
        <select id="lingua" class="lang-select" onchange="cambiaLingua()">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="form-group">
        <label id="lbl-nome">NOME E COGNOME / FULL NAME:</label>
        <input type="text" id="nome" placeholder="Es. Mario Rossi">
    </div>

    <div class="row">
        <div class="form-group">
            <label id="lbl-sangue">GRUPPO SANGUIGNO / BLOOD TYPE:</label>
            <select id="sangue">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="0+">0+</option>
                <option value="0-">0-</option>
            </select>
        </div>
        <div class="form-group">
            <label id="lbl-ice">CONTATTO D'EMERGENZA (ICE):</label>
            <input type="text" id="ice" placeholder="+39 333 1234567">
        </div>
    </div>

    <div class="form-group">
        <label id="lbl-patologie">PATOLOGIE / CONDIZIONI CRITICHE:</label>
        <textarea id="patologie" rows="2" placeholder="Es. Diabete Tipo 1, Pacemaker"></textarea>
    </div>

    <div class="row">
        <div class="form-group">
            <label id="lbl-allergie">ALLERGIE / ALLERGIES:</label>
            <input type="text" id="allergie" placeholder="Es. Penicillina, Lattice">
        </div>
        <div class="form-group">
            <label id="lbl-farmaci">FARMACI / MEDICATIONS:</label>
            <input type="text" id="farmaci" placeholder="Es. Insulina, Cardirene">
        </div>
    </div>

    <div class="form-group">
        <label id="lbl-interventi">INTERVENTI / SURGERIES:</label>
        <input type="text" id="interventi" placeholder="Es. Valvola cardiaca 2022">
    </div>

    <div class="row">
        <div class="form-group">
            <label id="lbl-scadenza">SCADENZA / EXPIRY DATE:</label>
            <input type="date" id="scadenza">
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="gdpr">
        <label for="gdpr" id="lbl-gdpr" style="color:var(--text-muted); display:inline;">Accetto il trattamento locale dei dati sanitari (Zero-Knowledge, GDPR & EHDS Compliant).</label>
    </div>

    <button class="btn" id="btn-genera" onclick="generaCard()">GENERA CARD & SALVA IMMAGINE</button>
    <div class="footer-note" id="lbl-footer">🔒 100% Offline • Universale per Soccorritori</div>
</div>

<!-- Card visiva pronta per il salvataggio in galleria -->
<div class="container" id="result-card">
    <div class="card-top">
        <span class="card-top-title" id="card-title-text">EMERGENCY MEDICAL CARD</span>
        <span class="card-top-brand">FABERHEALTH</span>
    </div>
    <div class="card-body-content" id="card-content-text">
        <!-- Dati clinici iniettati -->
    </div>
    <div class="card-meta-box" id="card-meta-text">
        <!-- Metadati -->
    </div>
    <div id="qrcode-container">
        <div id="qrcode"></div>
    </div>
    <button class="btn" id="btn-scarica" style="margin-top:15px; background:#ff4d4d; color:#fff;" onclick="salvaImmagine()">📥 SCARICA NELLA GALLERIA / SAVE</button>
    <button class="btn" id="btn-modifica" style="margin-top:10px; background:transparent; color:var(--text-muted); border:1px solid rgba(255,255,255,0.2);" onclick="chiudiCard()">🔄 MODIFICA / EDIT</button>
</div>

<script>
    // Testi multilingua integrati
    const dizionario = {
        it: {
            nome: "NOME E COGNOME:",
            sangue: "GRUPPO SANGUIGNO:",
            ice: "CONTATTO D'EMERGENZA (ICE):",
            patologie: "PATOLOGIE / CONDIZIONI CRITICHE:",
            allergie: "ALLERGIE:",
            farmaci: "FARMACI / TERAPIE:",
            interventi: "INTERVENTI / NOTE CHIRURGICHE:",
            scadenza: "VALIDITÀ / SCADENZA:",
            gdpr: "Accetto il trattamento locale dei dati sanitari (Zero-Knowledge, GDPR & EHDS Compliant).",
            genera: "GENERA CARD & SALVA IMMAGINE",
            footer: "🔒 100% Offline • Universale per Soccorritori",
            cardTitle: "EMERGENCY MEDICAL CARD",
            scarica: "📥 SCARICA NELLA GALLERIA",
            modifica: "🔄 MODIFICA DATI",
            errNome: "Inserisci almeno il Nome e Cognome.",
            errGdpr: "Devi accettare l'informativa sulla privacy locale GDPR.",
            etichetteCard: { nome: "Nome", sangue: "Gruppo Sanguigno", ice: "Contatto ICE", patologie: "Patologie", allergie: "Allergie", farmaci: "Farmaci", interventi: "Interventi" }
        },
        en: {
            nome: "FULL NAME:",
            sangue: "BLOOD TYPE:",
            ice: "EMERGENCY CONTACT (ICE):",
            patologie: "CRITICAL CONDITIONS / PATHOLOGIES:",
            allergie: "ALLERGIES:",
            farmaci: "MEDICATIONS / THERAPIES:",
            interventi: "SURGERIES / MEDICAL NOTES:",
            scadenza: "EXPIRY DATE:",
            gdpr: "I accept local health data processing (Zero-Knowledge, GDPR & EHDS Compliant).",
            genera: "GENERATE CARD & SAVE IMAGE",
            footer: "🔒 100% Offline • Universal First Responders Ready",
            cardTitle: "EMERGENCY MEDICAL CARD",
            scarica: "📥 SAVE TO GALLERY",
            modifica: "🔄 EDIT DATA",
            errNome: "Please enter at least your Full Name.",
            errGdpr: "You must accept the local GDPR privacy policy.",
            etichetteCard: { nome: "Name", sangue: "Blood Type", ice: "ICE Contact", patologie: "Pathologies", allergie: "Allergies", farmaci: "Medications", interventi: "Surgeries" }
        }
    };

    window.onload = function() {
        const today = new Date();
        const nextYear = new Date(today.setFullYear(today.getFullYear() + 1));
        document.getElementById('scadenza').valueAsDate = nextYear;
    };

    function cambiaLingua() {
        const lang = document.getElementById('lingua').value;
        const t = dizionario[lang];

        document.getElementById('lbl-nome').innerText = t.nome;
        document.getElementById('lbl-sangue').innerText = t.sangue;
        document.getElementById('lbl-ice').innerText = t.ice;
        document.getElementById('lbl-patologie').innerText = t.patologie;
        document.getElementById('lbl-allergie').innerText = t.allergie;
        document.getElementById('lbl-farmaci').innerText = t.farmaci;
        document.getElementById('lbl-interventi').innerText = t.interventi;
        document.getElementById('lbl-scadenza').innerText = t.scadenza;
        document.getElementById('lbl-gdpr').innerText = t.gdpr;
        document.getElementById('btn-genera').innerText = t.genera;
        document.getElementById('lbl-footer').innerText = t.footer;
        document.getElementById('card-title-text').innerText = t.cardTitle;
        document.getElementById('btn-scarica').innerText = t.scarica;
        document.getElementById('btn-modifica').innerText = t.modifica;
    }

    function generaCard() {
        const lang = document.getElementById('lingua').value;
        const t = dizionario[lang];

        const nome = document.getElementById('nome').value;
        const sangue = document.getElementById('sangue').value;
        const ice = document.getElementById('ice').value;
        const patologie = document.getElementById('patologie').value;
        const allergie = document.getElementById('allergie').value;
        const farmaci = document.getElementById('farmaci').value;
        const interventi = document.getElementById('interventi').value;
        const scadenzaInput = document.getElementById('scadenza').value;
        const gdpr = document.getElementById('gdpr').checked;

        if(!nome) {
            alert(t.errNome);
            return;
        }
        if(!gdpr) {
            alert(t.errGdpr);
            return;
        }

        const emissioneDate = new Date().toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-GB');
        const scadenzaFormatted = scadenzaInput ? new Date(scadenzaInput).toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-GB') : 'N/D';
        const cardId = 'FH-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        const ec = t.etichetteCard;

        // Popola i dati clinici nella card stilizzata
        const textContainer = document.getElementById('card-content-text');
        textContainer.innerHTML = `
            <p><strong>${ec.nome}:</strong> ${nome}</p>
            <p><strong>${ec.sangue}:</strong> <span style="color:var(--primary-cyan); font-weight:bold;">${sangue}</span></p>
            <p><strong>${ec.ice}:</strong> <a href="tel:${ice}" style="color:var(--primary-cyan); text-decoration:none;">${ice || 'N/D'}</a></p>
            <p><strong>${ec.patologie}:</strong> ${patologie || 'None / N/A'}</p>
            <p><strong>${ec.allergie}:</strong> ${allergie || 'None / N/A'}</p>
            <p><strong>${ec.farmaci}:</strong> ${farmaci || 'None / N/A'}</p>
            <p><strong>${ec.interventi}:</strong> ${interventi || 'None / N/A'}</p>
        `;

        // Metadati inferiori della card
        const metaContainer = document.getElementById('card-meta-text');
        metaContainer.innerHTML = `
            <span>ID: <strong>${cardId}</strong></span>
            <span>Issue: ${emissioneDate}</span>
            <span>Exp: <strong style="color:var(--accent-red);">${scadenzaFormatted}</strong></span>
        `;

        // Generazione QR Code internazionale
        document.getElementById('qrcode').innerHTML = "";
        const qrData = `FABERHEALTH ID: ${cardId}\n${ec.nome}: ${nome}\n${ec.sangue}: ${sangue}\n${ec.ice}: ${ice}\n${ec.patologie}: ${patologie}\n${ec.allergie}: ${allergie}\n${ec.farmaci}: ${farmaci}\nExp: ${scadenzaFormatted}`;
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 130,
            height: 130
        });

        // Transizione visiva
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }

    function salvaImmagine() {
        const cardElement = document.getElementById('result-card');
        const buttons = cardElement.querySelectorAll('button');
        buttons.forEach(b => b.style.display = 'none');

        html2canvas(cardElement, { backgroundColor: '#0f1923', scale: 2 }).then(canvas => {
            buttons.forEach(b => b.style.display = 'block');

            const link = document.createElement('a');
            link.download = 'FaberHealth-Emergency-Card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function chiudiCard() {
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
    }
</script>

</body>
</html>
