<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaberHealth - NFC & QR Emergency Card</title>
    <!-- Libreria QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Libreria per catturare la card come immagine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b131a;
            --card-bg: #111b24;
            --border-glow: #00ffcc55;
            --primary-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent-red: #ff4d4d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        .logo-badge {
            background: var(--primary-cyan);
            color: #000;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
        }
        .title h1 {
            font-size: 18px;
            margin: 0;
            color: var(--text-main);
        }
        .title p {
            font-size: 12px;
            margin: 2px 0 0;
            color: var(--primary-cyan);
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-cyan);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
        }
        .btn {
            width: 100%;
            background: var(--primary-cyan);
            color: #0b131a;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: background 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 15px;
        }
        /* Stile Card Generata */
        #result-card {
            display: none;
            margin-top: 20px;
            background: #111b24;
            border: 2px solid var(--primary-cyan);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .card-body p {
            margin: 6px 0;
            font-size: 13px;
        }
        #qrcode-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <div class="header">
        <div class="logo-badge">FH</div>
        <div class="title">
            <h1>FaberHealth</h1>
            <p>NFC & QR Emergency Card</p>
        </div>
    </div>

    <div class="form-group">
        <label>NOME E COGNOME:</label>
        <input type="text" id="nome" placeholder="Es. Mario Rossi">
    </div>

    <div class="row">
        <div class="form-group">
            <label>GRUPPO SANGUIGNO:</label>
            <select id="sangue">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="0+">0+</option>
                <option value="0-">0-</option>
            </select>
        </div>
        <div class="form-group">
            <label>CONTATTO D'EMERGENZA (ICE):</label>
            <input type="text" id="ice" placeholder="+39 333 1234567">
        </div>
    </div>

    <div class="form-group">
        <label>PATOLOGIE / CONDIZIONI CRITICHE:</label>
        <textarea id="patologie" rows="2" placeholder="Es. Diabete Tipo 1, Pacemaker"></textarea>
    </div>

    <div class="row">
        <div class="form-group">
            <label>ALLERGIE:</label>
            <input type="text" id="allergie" placeholder="Es. Penicillina, Lattice">
        </div>
        <div class="form-group">
            <label>FARMACI / TERAPIE:</label>
            <input type="text" id="farmaci" placeholder="Es. Insulina, Cardirene">
        </div>
    </div>

    <div class="form-group">
        <label>INTERVENTI / NOTE CHIRURGICHE:</label>
        <input type="text" id="interventi" placeholder="Es. Bypass gastrico 2022">
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="gdpr">
        <label for="gdpr" style="color:var(--text-muted); display:inline;">Accetto il trattamento locale dei dati sanitari (Zero-Knowledge, GDPR & EHDS Compliant). Nessun dato lascia il dispositivo.</label>
    </div>

    <button class="btn" onclick="generaCard()">GENERA CARD & SALVA IMMAGINE</button>
    <div class="footer-note">🔒 Sistema offline protetto • Conformità Europea garantita</div>
</div>

<!-- Card visiva pronta per il salvataggio in galleria -->
<div class="container" id="result-card">
    <div class="card-header">
        <strong>EMERGENCY MEDICAL CARD</strong>
        <span style="color:var(--primary-cyan); font-size:12px;">FABERHEALTH</span>
    </div>
    <div class="card-body" id="card-content-text">
        <!-- I dati inseriti verranno iniettati qui -->
    </div>
    <div id="qrcode-container">
        <div id="qrcode"></div>
    </div>
    <button class="btn" style="margin-top:15px; background:#ff4d4d; color:#fff;" onclick="salvaImmagine()">📥 SCARICA NELLA GALLERIA</button>
    <button class="btn" style="margin-top:10px; background:transparent; color:var(--text-muted); border:1px solid rgba(255,255,255,0.2);" onclick="chiudiCard()">🔄 MODIFICA DATI</button>
</div>

<script>
    function generaCard() {
        const nome = document.getElementById('nome').value;
        const sangue = document.getElementById('sangue').value;
        const ice = document.getElementById('ice').value;
        const patologie = document.getElementById('patologie').value;
        const allergie = document.getElementById('allergie').value;
        const farmaci = document.getElementById('farmaci').value;
        const interventi = document.getElementById('interventi').value;
        const gdpr = document.getElementById('gdpr').checked;

        if(!nome) {
            alert("Inserisci almeno il Nome e Cognome.");
            return;
        }
        if(!gdpr) {
            alert("Devi accettare l'informativa sulla privacy locale GDPR.");
            return;
        }

        // Popola i dati nella card
        const textContainer = document.getElementById('card-content-text');
        textContainer.innerHTML = `
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>Gruppo Sanguigno:</strong> <span style="color:var(--primary-cyan);">${sangue}</span></p>
            <p><strong>Contatto ICE:</strong> ${ice}</p>
            <p><strong>Patologie:</strong> ${patologie || 'Nessuna'}</p>
            <p><strong>Allergie:</strong> ${allergie || 'Nessuna'}</p>
            <p><strong>Farmaci:</strong> ${farmaci || 'Nessuno'}</p>
            <p><strong>Interventi:</strong> ${interventi || 'Nessuno'}</p>
        `;

        // Pulisci e genera QR Code
        document.getElementById('qrcode').innerHTML = "";
        const qrData = `EMERGENCY CARD\nNome: ${nome}\nSangue: ${sangue}\nICE: ${ice}\nPatologie: ${patologie}\nAllergie: ${allergie}\nFarmaci: ${farmaci}`;
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 140,
            height: 140
        });

        // Mostra la card e nascondi il form
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }

    function salvaImmagine() {
        const cardElement = document.getElementById('result-card');
        // Nascondi temporaneamente i bottoni all'interno della card prima di fare lo screenshot
        const buttons = cardElement.querySelectorAll('button');
        buttons.forEach(b => b.style.display = 'none');

        html2canvas(cardElement, { backgroundColor: '#111b24', scale: 2 }).then(canvas => {
            // Mostra di nuovo i bottoni
            buttons.forEach(b => b.style.display = 'block');

            const link = document.createElement('a');
            link.download = 'FaberHealth-Emergency-Card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function chiudiCard() {
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
    }
</script>

</body>
</html>
